[package]
name = "air01"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Native Linux configuration tool for the Akko Air 01"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
fs2 = "0.4"
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_28"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
